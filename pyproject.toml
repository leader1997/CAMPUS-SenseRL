[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-senserl"
version = "0.1.0"
description = "CAMPUS-SenseRL: Semantic-Aware Constrained Multi-Agent RL for Autonomous IoT Sensing in Smart Campuses"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CAMPUS-SenseRL Research Team" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "gymnasium>=0.29",
  "networkx>=3.1",
  "tqdm>=4.66",
  "torch>=2.0",
  "lightgbm>=4.0",
  "xgboost>=2.0",
  "tabulate>=0.9",
  "jinja2>=3.1",
  "pytest>=7.4",
]

[project.optional-dependencies]
rl = ["stable-baselines3>=2.2"]
dev = ["pytest>=7.4", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
